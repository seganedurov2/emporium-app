# Publish the built game to GitHub Pages at https://<owner>.github.io/<repo>/
#
# The app is a Vite SPA with `base: './'`, so it works from a project subpath; the
# build writes 404.html (scripts/add-spa-404.mjs) so a deep link still boots the app.
#
# One-time setup in the repository:
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".

name: Deploy to GitHub Pages

on:
  push:
    branches: [0.6.5]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; a newer push cancels a queued one but never an
# in-flight production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build:web

      # GitHub Pages treats every folder without an index.html as a 404; the SPA
      # fallback is already emitted as 404.html by the build script.
      - name: Verify SPA fallback
        run: test -f dist/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4